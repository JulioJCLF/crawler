name: arsenal-watch

on:
  schedule:
    - cron: "0 12 * * *"      # todo dia 12:00 UTC (09:00 BRT). Semanal: "0 12 * * 1"
  workflow_dispatch: {}        # permite rodar na mao pela aba Actions

permissions:
  contents: write              # necessario pra commitar o snapshot.json de volta
  issues: write                 # REQ-018: abrir/atualizar/fechar Issue de alerta de falha

concurrency:
  group: arsenal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: cd backend && npm ci

      - name: Rodar crawler
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: cd backend && npm start

      - name: Reportar queda brusca de categoria (REQ-019)
        # Sem "if": só roda se o crawler tiver terminado com sucesso. Se o
        # crawler falhou totalmente, o category-alert.json nem foi escrito —
        # não faz sentido (nem é seguro) decidir fechar/abrir Issue de
        # categoria nesse caso; REQ-018 já cobre a falha total.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend
          npx tsx src/reportCategoryDrops.ts category-alert.json

      - name: Commitar snapshot atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/snapshot.json
          if git diff --staged --quiet; then
            echo "snapshot sem mudancas"
          else
            git commit -m "chore: update snapshot"
            git push
          fi

      - name: Reportar falha ou recuperação da execução (REQ-018)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend
          npx tsx src/reportExecutionStatus.ts \
            --status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
